<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Etch-a-Sketch</title>
  <style>
    body { font-family: system-ui, sans-serif; text-align: center; padding: 1rem 16px; background: #c0392b; color: #fff; }
    #grid { display: flex; flex-wrap: wrap; width: min(560px, calc(100vw - 32px)); aspect-ratio: 1; margin: 1rem auto; background: #ddd; border: 16px solid #a93226; border-radius: 12px; }
    .cell { background: #fff; }
    .controls button { margin: 0.25rem; padding: 0.5rem 1rem; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Etch-a-Sketch</h1>
  <div class="controls">
    <button id="size">New grid</button>
    <button id="mode">Mode: ink</button>
    <button id="clear">Shake</button>
  </div>
  <div id="grid"></div>
  <script src="sketch.js"></script>
</body>
</html>
